<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Quiz</title>
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#1b2a2a;--mute:#5d6e6c;--line:#cfd9d6;--acc:#0f6b66;--ok:#1b7f45;--okbg:#dff3e6;--bad:#b3261e;--badbg:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b1a;--card:#182827;--ink:#e6f0ee;--mute:#9bb0ad;--line:#2d4442;--acc:#4fd1c5;--ok:#6fdc9a;--okbg:#17382a;--bad:#ff8f86;--badbg:#401f1d}}
:root[data-theme="dark"]{--bg:#101b1a;--card:#182827;--ink:#e6f0ee;--mute:#9bb0ad;--line:#2d4442;--acc:#4fd1c5;--ok:#6fdc9a;--okbg:#17382a;--bad:#ff8f86;--badbg:#401f1d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:560px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-family:system-ui,sans-serif;font-size:14px;color:var(--mute)}
.lvl{font-size:44px;font-weight:700;color:var(--acc);font-family:Georgia,serif;line-height:1}
.lives{font-size:20px;letter-spacing:2px;color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.cat{font-family:system-ui,sans-serif;font-size:13px;color:var(--mute);margin-bottom:8px}
.q{font-size:22px;line-height:1.4;margin:0 0 18px}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{text-align:left;padding:13px 15px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:16px;padding:14px;border-radius:10px;font-size:16px;line-height:1.5}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b{display:block;font-size:18px;margin-bottom:4px}
.btn{margin-top:14px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);font-size:18px;font-weight:700}
.hide{display:none}.acct{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font:15px/1.5 system-ui,sans-serif}.acct h2{font:700 17px Georgia,serif;margin:14px 0 6px}.acct input{padding:9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;margin:8px 8px 0 0}.acct button{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}.acct ol{margin:0;padding-left:24px}.langbar{display:flex;justify-content:flex-end;margin-bottom:10px}.langbar select{font:15px system-ui,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.center{text-align:center}
.center h1{font-size:34px;margin:6px 0}
.center p{color:var(--mute);line-height:1.5}
.big{font-size:56px;font-weight:700;color:var(--acc)}
.auth h1{font-size:30px;margin:0 0 4px}
.auth form{display:grid;gap:10px;text-align:left;margin-top:8px}
.auth input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:17px system-ui,sans-serif}
.auth input:focus-visible,.tabs button:focus-visible,.lnk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 4px}
.tabs button{padding:10px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:600 15px system-ui,sans-serif}
.tabs button[aria-selected=true]{border-color:var(--acc);background:var(--acc);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:0}
.btn:disabled{opacity:.6;cursor:default}
.lnks{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;font:15px system-ui,sans-serif;padding:6px 2px}
.amsg{min-height:20px;font:15px/1.4 system-ui,sans-serif;color:var(--bad)}.amsg.good{color:var(--ok)}
.acct #outBtn{margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="langbar"><select id="lang" aria-label="Language"></select></div>
  <div id="auth" class="card center auth hide">
    <h1 id="aTitle"></h1>
    <div class="tabs" role="tablist"><button type="button" id="tabIn" role="tab"></button><button type="button" id="tabUp" role="tab"></button></div>
    <form id="authForm" novalidate>
      <input id="aName" class="hide" maxlength="20" autocomplete="nickname">
      <input id="aEmail" type="email" maxlength="254" autocomplete="email" inputmode="email">
      <input id="aPass" type="password" maxlength="128" autocomplete="current-password">
      <div id="aMsg" class="amsg" role="alert"></div>
      <button class="btn" id="aSubmit" type="submit" style="margin-top:0"></button>
      <button class="btn alt" id="aGoogle" type="button"></button>
    </form>
    <div class="lnks"><button type="button" class="lnk" id="aForgot"></button><a class="lnk" href="quiz-privacy.html" target="_blank" rel="noopener">Privacy policy</a></div>
  </div>
  <div id="start" class="card center">
    <h1 id="tTitle"></h1>
    <p id="tIntro"></p>
    <p id="best"></p>
    <button class="btn" id="go"></button>
  </div>

  <div id="game" class="hide">
    <div class="top"><div><div class="lvl" id="lvl">1</div><span id="lvlLbl"></span></div><div class="center"><span id="scoreLbl"></span> <b id="score">0</b><br><span id="streakLbl"></span> <b id="streak">0</b></div><div class="lives" id="lives" aria-label="Lives"></div></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="cat" id="cat"></div>
      <p class="q" id="q"></p>
      <div class="opts" id="opts"></div>
      <div id="fb" class="fb hide" role="status"></div>
      <button class="btn hide" id="next">Next level</button>
      <button class="btn alt hide" id="revive" type="button" style="margin-top:10px"></button>
    </div>
  </div>

  <section id="acct" class="acct"><b id="acctT"></b><div id="acctMsg"></div><button type="button" id="outBtn" class="hide"></button>
    <div id="guestBox" class="hide"><input id="nick" maxlength="20"><button id="nickBtn"></button></div>
    <div id="lbBox" class="hide"><h2 id="lbT"></h2><div id="lbEmpty" class="hide"></div><ol id="lb"></ol></div>
  </section>

  <div id="over" class="card center hide">
    <h1 id="tOver"></h1>
    <div class="big" id="ofin">0</div>
    <p id="osum"></p>
    <button class="btn" id="again">Play again</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

en:{title:"Endless Quiz",intro:"One question per level, and the levels never end. Every answer is revealed with a short explanation. You have 3 lives, and you earn one back every 5 levels.",best:(l,s)=>`Best: level ${l}, ${s} points`,nobest:"No best score yet. Set one!",start:"Start level 1",level:"Level",score:"Score",streak:"Streak",ok:p=>`Correct! +${p} points`,bad:a=>`Not quite. The answer is ${a}.`,bonus:l=>`Bonus: you earned an extra life for finishing level ${l}.`,next:n=>`Go to level ${n}`,results:"See results",over:"Game over",reached:(l,r)=>`You reached level ${l} and answered ${r} correctly.`,nb:" New best score!",again:"Play again",

 sAdd:(d,x,n)=>`Dinadagdagan ng ${d} ang bawat termino, kaya ang susunod ay ${x} + ${d} = ${n}.`,sMul:(r,x,n)=>`Minumultiply ng ${r} ang bawat termino, kaya ang susunod ay ${x} × ${r} = ${n}.`,sSq:(o,n,r)=>`Magkakasunod na kuwadrado ito (${o}², ${o+1}², ...). Ang susunod ay ${n}² = ${r}.`,sFib:(x,y,n)=>`Ang bawat termino ay kabuuan ng dalawang nauna (istilong Fibonacci), kaya ${x} + ${y} = ${n}.`,

let bag=[];

// ---------- Procedural generators (infinite). Answers stay language-neutral numbers.
function numOpts(ans,spread){
  const s=new Set([ans]);let g=0;
  while(s.size<4&&g++<80){const v=ans+rnd(1,Math.max(2,spread))*(Math.random()<.5?-1:1);if(v>=0||ans<0)s.add(v)}
  let i=1;while(s.size<4)s.add(ans+i++);
  return shuffle([...s]).map(String);
}
const roman=n=>{const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[v,s]of m)while(n>=v){r+=s;n-=v}return r};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};

const GEN={
arith(Lv){
  const top=Math.pow(10,Math.min(1+Math.floor(Lv/5),4)),k=Lv<4?rnd(0,1):rnd(0,3);
  let a=rnd(2,top),b=rnd(2,top),q,ans,exp;
  if(k===0){q=`${a} + ${b}`;ans=a+b;exp=`${q} = ${ans}`}
  else if(k===1){if(b>a)[a,b]=[b,a];q=`${a} − ${b}`;ans=a-b;exp=`${q} = ${ans}`}
  else if(k===2){a=rnd(2,Math.min(12+Lv,60));b=rnd(2,Math.min(12+Math.floor(Lv/2),40));q=`${a} × ${b}`;ans=a*b;exp=`${q} = ${ans}`}
  else{b=rnd(2,Math.min(12+Math.floor(Lv/3),30));ans=rnd(2,Math.min(15+Lv,60));a=b*ans;q=`${a} ÷ ${b}`;exp=`${b} × ${ans} = ${a} ⇒ ${q} = ${ans}`}
  return{cat:"arith",q:t().qa(q),a:String(ans),opts:numOpts(ans,Math.max(3,Math.round(ans/8)||3)),exp};
},
seq(Lv){
  const k=Lv<6?0:rnd(0,3);let s,n,exp;const T_=t();
  if(k===0){const a=rnd(1,20),d=rnd(2,9+Lv);s=[0,1,2,3].map(i=>a+d*i);n=a+d*4;exp=T_.sAdd(d,s[3],n)}
  else if(k===1){const a=rnd(1,4),r=rnd(2,3);s=[0,1,2,3].map(i=>a*Math.pow(r,i));n=a*Math.pow(r,4);exp=T_.sMul(r,s[3],n)}
  else if(k===2){const o=rnd(1,6);s=[0,1,2,3].map(i=>(i+o)**2);n=(4+o)**2;exp=T_.sSq(o,4+o,n)}
  else{const a=rnd(1,5),b=rnd(1,6);s=[a,b,a+b,a+2*b];n=s[2]+s[3];exp=T_.sFib(s[2],s[3],n)}
  return{cat:"seq",q:T_.qs(s.join(", ")),a:String(n),opts:numOpts(n,Math.max(3,Math.round(n/6))),exp};
},
bin(Lv){
  const bits=Math.min(3+Math.floor(Lv/4),10),n=rnd(2,(1<<bits)-1),b=n.toString(2);
  const ts=[...b].map((c,i)=>c==="1"?1<<(b.length-1-i):null).filter(Boolean).join(" + ")+" = "+n;
  return{cat:"bin",q:t().qb(b),a:String(n),opts:numOpts(n,Math.max(3,Math.round(n/5))),exp:t().eb(ts)};
},
rom(Lv){
  const n=rnd(2,Math.min(20+Lv*20,3999)),r=roman(n);
  return{cat:"rom",q:t().qr(r),a:String(n),opts:numOpts(n,Math.max(4,Math.round(n/10))),exp:t().er(r,n)};
},
pct(Lv){
  const p=pick(Lv<8?[10,20,25,50]:[5,12,15,30,35,40,60,75,80]),base=rnd(2,Math.min(10+Lv*2,80))*20,ans=p*base/100;
  return{cat:"pct",q:t().qp(p,base),a:String(ans),opts:numOpts(ans,Math.max(3,Math.round(ans/4))),exp:`${p}/100 × ${base} = ${ans}`};
},
prime(Lv){
  const hi=Math.min(30+Lv*10,500),pr=[],co=[];
  for(let i=2;i<=hi;i++)(isPrime(i)?pr:co).push(i);
  const p=pick(pr.filter(x=>x>hi/3)),cs=shuffle(co.filter(x=>x%2&&x%3&&x>hi/4)).slice(0,3);
  const d=cs.map(c=>{for(let f=2;f<c;f++)if(c%f===0)return`${c} = ${f} × ${c/f}`;return""}).join("; ");
  return{cat:"prime",q:t().qpr,a:String(p),opts:shuffle([p,...cs]).map(String),exp:t().ep(p,d)};
}
};

function makeQuestion(Lv){
  if(Math.random()<0.4){
    const maxD=Math.min(3,1+Math.floor(Lv/6));
    let pool=T.map((_,i)=>i).filter(i=>T[i][0]<=maxD&&!bag.includes(i));
    if(!pool.length){bag=[];pool=T.map((_,i)=>i).filter(i=>T[i][0]<=maxD)}
    const i=pick(pool);bag.push(i);const x=T[i],tx=TR[lang]&&TR[lang][i];
    return{cat:"tri",q:tx?tx[0]:x[1],a:x[2],opts:shuffle([x[2],...x[3]]),exp:tx?tx[1]:x[4]};
  }
  return GEN[pick(["arith","arith","seq","bin","rom","pct","prime"])](Lv);
}

let S={},cur=null,locked=false,lastKey="";
const MAXL=5;
function setText(){
  const x=t();document.documentElement.lang=lang;document.title=x.title;
  $("tTitle").textContent=x.title;$("tIntro").textContent=x.intro;$("go").textContent=x.start;
  $("lvlLbl").textContent=x.level;$("scoreLbl").textContent=x.score;$("streakLbl").textContent=x.streak;
  $("tOver").textContent=x.over;$("again").textContent=x.again;showBest();
  $("acctT").textContent=x.acct;$("lbT").textContent=x.lb;$("lbEmpty").textContent=x.lbEmpty;$("nick").placeholder=x.nickPh;$("nickBtn").textContent=x.nickBtn;renderAcct();if(FB||NOCFG)setAuthText();
  if(cur)$("cat").textContent=x.cat[cur.cat];
}
function showBest(){const b=store("eq_best");$("best").textContent=b?t().best(...b.split("|")):t().nobest}
function start(){
  if(NOCFG||(FB&&!FBU))return;
  S={level:1,score:0,streak:0,lives:3,right:0,revives:0};bag=[];
  $("start").classList.add("hide");$("over").classList.add("hide");$("game").classList.remove("hide");$("acct").classList.add("hide");
  load();
}
function render(){
  $("lvl").textContent=S.level;$("score").textContent=S.score;$("streak").textContent=S.streak;
  $("lives").textContent="♥".repeat(S.lives)+"♡".repeat(Math.max(0,3-S.lives));
  $("prog").style.width=((S.level-1)%5)/5*100+"%";
}
function load(){
  let n=0;do{cur=makeQuestion(S.level)}while(cur.q+cur.a===lastKey&&n++<5);
  lastKey=cur.q+cur.a;locked=false;render();
  $("cat").textContent=t().cat[cur.cat];$("q").textContent=cur.q;
  $("fb").className="fb hide";$("next").classList.add("hide");$("revive").classList.add("hide");
  const box=$("opts");box.innerHTML="";
  cur.opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.dataset.v=o;b.textContent=tr(o);b.onclick=()=>answer(b,o);box.appendChild(b)});
}
function answer(btn,val){
  if(locked)return;locked=true;
  const ok=val===cur.a,x=t();
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===cur.a)b.classList.add("ok")});
  const fb=$("fb");
  if(ok){
    S.streak++;S.right++;const pts=10+S.level*2+Math.min(S.streak,10)*2;S.score+=pts;
    fb.className="fb ok";fb.innerHTML=`<b>${x.ok(pts)}</b>${cur.exp}`;
  }else{
    btn.classList.add("bad");S.streak=0;S.lives--;
    fb.className="fb bad";fb.innerHTML=`<b>${x.bad(tr(cur.a))}</b>${cur.exp}`;
  }
  if(ok&&S.level%5===0&&S.lives<MAXL){S.lives++;fb.innerHTML+=`<br><br>${x.bonus(S.level)}`}
  render();
  const dead=S.lives<=0;
  $("next").textContent=dead?x.results:x.next(S.level+1);
  $("next").classList.remove("hide");$("next").focus();
  $("next").onclick=dead?end:()=>{S.level++;load()};
  if(dead)offerRevive();
}
function end(){
  $("revive").classList.add("hide");
  $("game").classList.add("hide");$("over").classList.remove("hide");$("acct").classList.remove("hide");
  $("ofin").textContent=S.score;
  const b=store("eq_best"),prev=b?+b.split("|")[1]:-1;let nb="";
  if(S.score>prev){store("eq_best",`${S.level}|${S.score}`);nb=t().nb}
  $("osum").textContent=t().reached(S.level,S.right)+nb;
  showBest();saveScore();
}

let DB=null,UM=null,UID=null;
async function initAccount(){
  if(initFirebase())return startFbAuth();
  if(!window.claude)return startNoConfig();
  try{if(window.claude){UM=await claude.use("user");DB=await claude.use("db");if(UM&&DB)UID=await UM.id()}}catch(e){}
  if(!UID)DB=null;
  renderAcct();loadLB();
}
async function renderAcct(){
  if(FB)return renderFbAcct();
  const x=t(),m=$("acctMsg");
  if(UID){
    let n="";try{n=(await UM.me()).name}catch(e){}
    m.textContent=x.signed(n||x.anon)+" "+x.sync;$("guestBox").classList.add("hide");$("lbBox").classList.remove("hide");
  }else{
    const n=store("eq_nick");m.textContent=n?x.hello(n):x.guest;
    $("guestBox").classList.remove("hide");$("lbBox").classList.add("hide");if(n&&!$("nick").value)$("nick").value=n;
  }
}
async function loadLB(){
  if(FB)return fbLoadLB();
  if(!DB)return;
  try{
    const snap=await DB.collection("leaderboard").orderBy("score","desc").limit(10).get();
    const ps=snap.empty?{}:await UM.profiles(snap.docs.map(d=>d.id));
    const ol=$("lb");ol.innerHTML="";$("lbEmpty").classList.toggle("hide",!snap.empty);
    snap.docs.forEach(d=>{const v=d.data(),p=ps[d.id],li=document.createElement("li");
      li.textContent=`${(p&&p.name)||t().anon}${p&&p.isMe?" ★":""}: ${v.score} (${t().level} ${v.level})`;ol.appendChild(li)});
  }catch(e){}
}
async function saveScore(){
  if(FB)return fbSaveScore();
  if(!UID||!DB)return;
  try{
    const ref=DB.collection("leaderboard").doc(UID),s=await ref.get(),o=s.exists?s.data():null;
    if(!o||S.score>o.score)await ref.set({score:S.score,level:S.level});
    loadLB();
  }catch(e){$("osum").textContent+=" "+t().ro}
}

let NOCFG=false,FB=null,FBU=null,guestMode=false,authMode="in",lastUid="__init__";
function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey||!window.firebase)return false;
  try{firebase.initializeApp(FIREBASE_CONFIG);FB={auth:firebase.auth(),db:firebase.firestore()};return true}catch(e){FB=null;return false}
}
const dispName=u=>String((u&&u.displayName)||t().anon).slice(0,20);
function amsg(text,good){const m=$("aMsg");m.textContent=text||"";m.className=good?"amsg good":"amsg"}
function busy(on){["aSubmit","aGoogle"].forEach(id=>$(id).disabled=on)}
function setAuthMode(m){
  authMode=m;const up=m==="up",x=t();
  $("tabIn").setAttribute("aria-selected",!up);$("tabUp").setAttribute("aria-selected",up);
  $("aName").classList.toggle("hide",!up);$("aSubmit").textContent=up?x.subUp:x.subIn;
  $("aPass").autocomplete=up?"new-password":"current-password";amsg("");
}
function setAuthText(){
  const x=t();$("aTitle").textContent=x.aTitle;$("tabIn").textContent=x.tabIn;$("tabUp").textContent=x.tabUp;
  $("aName").placeholder=x.aName;$("aName").setAttribute("aria-label",x.aName);
  $("aEmail").placeholder=x.aEmail;$("aEmail").setAttribute("aria-label",x.aEmail);
  $("aPass").placeholder=x.aPass;$("aPass").setAttribute("aria-label",x.aPass);
  $("aGoogle").textContent=x.google;$("aForgot").textContent=x.forgot;
  setAuthMode(authMode);renderFbAcct();
  if(NOCFG)amsg(x.noCfg);
}
function showAuth(on){
  ["start","over","game"].forEach(id=>$(id).classList.add("hide"));
  $("acct").classList.toggle("hide",on);$("auth").classList.toggle("hide",!on);
  if(!on)$("start").classList.remove("hide");
}
function errText(e){
  const x=t(),c=(e&&e.code)||"";
  if(["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-login-credentials"].includes(c))return x.eCred;
  if(c==="auth/email-already-in-use")return x.eUsed;
  if(c==="auth/weak-password")return x.eWeak;
  if(c==="auth/invalid-email")return x.eEmail;
  if(c==="auth/too-many-requests")return x.eMany;
  if(c==="auth/network-request-failed")return x.eNet;
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "";
  return x.eGen;
}
async function submitAuth(ev){
  ev.preventDefault();const x=t(),email=$("aEmail").value.trim(),pw=$("aPass").value;
  if(!email||!pw){amsg(x.eFill);return}
  if(authMode==="up"){
    const nm=$("aName").value.trim().slice(0,20);
    if(!nm){amsg(x.eName);return}
    if(pw.length<8){amsg(x.eWeak);return}
    busy(true);
    try{
      const c=await FB.auth.createUserWithEmailAndPassword(email,pw);
      await c.user.updateProfile({displayName:nm});
      try{await c.user.sendEmailVerification()}catch(_){}
      renderFbAcct();amsg(x.verifySent,true);
    }catch(e){amsg(errText(e))}
  }else{
    busy(true);
    try{await FB.auth.signInWithEmailAndPassword(email,pw);amsg("")}catch(e){amsg(errText(e))}
  }
  $("aPass").value="";busy(false);
}
async function googleAuth(){
  busy(true);amsg("");
  try{await FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){amsg(errText(e))}
  busy(false);
}
async function forgot(){
  const x=t(),email=$("aEmail").value.trim();
  if(!email){amsg(x.eReset);return}
  try{await FB.auth.sendPasswordResetEmail(email)}catch(e){if(e&&e.code==="auth/network-request-failed"){amsg(x.eNet);return}}
  amsg(x.resetSent,true); // same message whether or not the account exists
}
function startNoConfig(){
  NOCFG=true;showAuth(true);
  document.querySelectorAll("#auth input,#auth button").forEach(e=>e.disabled=true);
  setAuthText();
}
function startFbAuth(){
  $("start").classList.add("hide");$("acct").classList.add("hide");
  $("tabIn").onclick=()=>setAuthMode("in");$("tabUp").onclick=()=>setAuthMode("up");
  $("authForm").onsubmit=submitAuth;$("aGoogle").onclick=googleAuth;$("aForgot").onclick=forgot;
  $("outBtn").onclick=()=>{if(FBU)FB.auth.signOut();else{guestMode=false;showAuth(true)}};
  FB.auth.onAuthStateChanged(u=>{
    FBU=u;const uid=u?u.uid:null,changed=uid!==lastUid;lastUid=uid;
    if(changed){if(u)guestMode=false;showAuth(!u&&!guestMode)}
    renderFbAcct();fbLoadLB();
  });
  setAuthText();
}
function renderFbAcct(){
  if(!FB)return;
  const x=t(),m=$("acctMsg");$("guestBox").classList.add("hide");$("outBtn").classList.remove("hide");
  if(FBU){
    m.textContent=x.signed(dispName(FBU))+" "+x.sync+(FBU.emailVerified?"":" "+x.needVerify);
    $("lbBox").classList.remove("hide");$("outBtn").textContent=x.signOut;
  }else{
    m.textContent=x.fbGuest;$("lbBox").classList.add("hide");$("outBtn").textContent=x.signIn;
  }
}
async function fbLoadLB(){
  if(!FB||!FBU)return;
  try{
    const snap=await FB.db.collection("leaderboard").orderBy("score","desc").limit(10).get();
    const ol=$("lb");ol.innerHTML="";$("lbEmpty").classList.toggle("hide",!snap.empty);
    snap.forEach(d=>{const v=d.data(),li=document.createElement("li");
      li.textContent=`${String(v.name||t().anon).slice(0,20)}${d.id===FBU.uid?" ★":""}: ${v.score} (${t().level} ${v.level})`;ol.appendChild(li)});
  }catch(e){}
}
async function fbSaveScore(){
  if(!FB||!FBU)return;
  try{
    await FBU.reload();await FBU.getIdToken(true);
    if(!FBU.emailVerified){$("osum").textContent+=" "+t().needVerify;return}
    const ref=FB.db.collection("leaderboard").doc(FBU.uid),s=await ref.get();
    if(!s.exists||S.score>s.data().score)await ref.set({name:dispName(FBU),score:S.score,level:S.level,updated:firebase.firestore.FieldValue.serverTimestamp()});
    fbLoadLB();
  }catch(e){$("osum").textContent+=" "+t().ro}
}
// ---------- Rewarded ads: AdSense H5 Games Ads (Ad Placement API). One extra life per ad the player chooses to watch.
// Keep test:true until Google approves H5 Games Ads for your account, then set test:false.
const ADS={client:"ca-pub-3070013351505360",test:true,on:false};
const MAXREV=1; // extra lives a player can earn per game
Object.assign(L.en,{revive:"Watch an ad to continue with 1 life"});
Object.assign(L.fil,{revive:"Manood ng ad para magpatuloy na may 1 buhay"});
Object.assign(L.es,{revive:"Mira un anuncio para continuar con 1 vida"});
let adShowing=false,reviveGo=false;
function initAds(){
  if(!ADS.client)return;
  const sc=document.createElement("script");
  sc.async=true;sc.crossOrigin="anonymous";
  sc.setAttribute("data-ad-frequency-hint","30s");
  if(ADS.test)sc.setAttribute("data-adbreak-test","on");
  sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+encodeURIComponent(ADS.client);
  sc.onerror=()=>{ADS.on=false};
  document.head.appendChild(sc);
  window.adsbygoogle=window.adsbygoogle||[];
  window.adBreak=window.adConfig=o=>window.adsbygoogle.push(o);
  ADS.on=true;
  adConfig({preloadAdBreaks:"on",sound:"on"});
}
function offerRevive(){
  if(!ADS.on||S.revives>=MAXREV)return;
  reviveGo=false;
  try{
    adBreak({
      type:"reward",name:"extra_life",
      // Shown only when Google has a rewarded ad ready. The player opts in by tapping the button.
      beforeReward:show=>{const b=$("revive");b.textContent=t().revive;b.classList.remove("hide");b.onclick=()=>{b.classList.add("hide");show()}},
      beforeAd:()=>{adShowing=true},
      adViewed:()=>{reviveGo=true},   // watched to the end: reward is granted in afterAd
      adDismissed:()=>{},             // closed early: no reward
      afterAd:()=>{adShowing=false;if(reviveGo){reviveGo=false;S.revives++;S.lives=1;S.level++;load()}},
      adBreakDone:()=>{}
    });
  }catch(e){}
}
$("nickBtn").onclick=()=>{const n=$("nick").value.trim().slice(0,20);if(n){store("eq_nick",n);renderAcct()}};
$("nick").onkeydown=e=>{if(e.key==="Enter")$("nickBtn").click()};
initAccount();initAds();

Object.keys(LANGS).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=LANGS[k];sel.appendChild(o)});
sel.value=lang;
sel.onchange=()=>{lang=sel.value;store("eq_lang",lang);setText()};
$("go").onclick=start;$("again").onclick=start;
document.addEventListener("keydown",e=>{
  if(document.activeElement===sel||document.activeElement.tagName==="INPUT")return;
  if(e.key>="1"&&e.key<="4"&&!locked&&!$("game").classList.contains("hide")){const b=document.querySelectorAll(".opt")[+e.key-1];if(b)b.click()}
  else if(e.key==="Enter"&&locked&&!adShowing&&!$("next").classList.contains("hide"))$("next").click();
});
setText();
